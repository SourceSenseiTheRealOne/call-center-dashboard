<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 750" role="img" aria-labelledby="title desc">
  <title id="title">Call Center Dashboard — frontend-only source architecture</title>
  <desc id="desc">React routing composes sample dashboard, analytics, directory and workflow views inside one browser. Demo identity uses localStorage; business data is sample arrays and transient React state. No backend, telephony, AI execution, recording or retention service is implemented. This is a source map, not authenticated runtime proof.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#67e8f9"/></marker>
    <marker id="rose-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#fda4af"/></marker>
  </defs>
  <rect width="1040" height="750" rx="18" fill="#0b1220"/>
  <g font-family="system-ui, sans-serif">
    <text x="36" y="53" fill="#f8fafc" font-size="29" font-weight="700">Call Center Dashboard</text>
    <text x="36" y="83" fill="#67e8f9" font-size="18">Frontend prototype / source architecture</text>
    <text x="36" y="111" fill="#cbd5e1" font-size="15">Implemented UI composition, not evidence of an operating call center.</text>

    <rect x="28" y="140" width="984" height="412" rx="12" fill="#111c2e" stroke="#64748b" stroke-dasharray="7 5"/>
    <text x="48" y="167" fill="#cbd5e1" font-size="14" font-weight="600">BROWSER — React 18 · TypeScript · Vite · Tailwind · Recharts</text>

    <path d="M312 246H356" stroke="#67e8f9" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M182 358V306" stroke="#fda4af" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#rose-arrow)"/>
    <path d="M312 433H356" stroke="#fda4af" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#rose-arrow)"/>
    <path d="M835 358V306" stroke="#67e8f9" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="52" y="192" width="260" height="114" rx="8" fill="#132e42" stroke="#22d3ee"/>
    <text x="70" y="224" fill="#f8fafc" font-size="19" font-weight="600">Boot + routing</text>
    <text x="70" y="253" fill="#e2e8f0" font-size="15">main.tsx → App.tsx</text>
    <text x="70" y="278" fill="#cbd5e1" font-size="15">BrowserRouter + shared shell</text>

    <rect x="356" y="192" width="630" height="114" rx="8" fill="#132e42" stroke="#22d3ee"/>
    <text x="376" y="224" fill="#f8fafc" font-size="19" font-weight="600">Sample views + reusable components</text>
    <text x="376" y="253" fill="#e2e8f0" font-size="15">Dashboard / Analytics · cards, charts and recent-call table</text>
    <text x="376" y="278" fill="#cbd5e1" font-size="15">PhoneList / Messages / Workflows / Settings / UserManagement</text>

    <rect x="52" y="358" width="260" height="154" rx="8" fill="#331f32" stroke="#fb7185"/>
    <text x="70" y="389" fill="#fff1f2" font-size="19" font-weight="600">Demo identity</text>
    <text x="70" y="420" fill="#fecdd3" font-size="15">AuthProvider + client guards</text>
    <text x="70" y="449" fill="#e2e8f0" font-size="15">Browser-side role checks</text>
    <text x="70" y="483" fill="#fda4af" font-size="15" font-weight="600">Not server authorization</text>

    <rect x="356" y="358" width="302" height="154" rx="8" fill="#231e3e" stroke="#a78bfa"/>
    <text x="376" y="389" fill="#f8fafc" font-size="19" font-weight="600">localStorage</text>
    <text x="376" y="420" fill="#e2e8f0" font-size="15">Mock user object only</text>
    <text x="376" y="449" fill="#cbd5e1" font-size="15">Not a session authority</text>
    <text x="376" y="483" fill="#c4b5fd" font-size="15">No business-data persistence</text>

    <rect x="686" y="358" width="300" height="154" rx="8" fill="#132e42" stroke="#22d3ee"/>
    <text x="706" y="389" fill="#f8fafc" font-size="19" font-weight="600">Data + UI state</text>
    <text x="706" y="420" fill="#e2e8f0" font-size="15">Inline sample arrays / metrics</text>
    <text x="706" y="449" fill="#cbd5e1" font-size="15">Filters, tabs, expanders, toggles</text>
    <text x="706" y="483" fill="#67e8f9" font-size="15">Transient React state</text>

    <rect x="28" y="580" width="984" height="103" rx="10" fill="#291c29" stroke="#fb7185"/>
    <text x="48" y="611" fill="#fda4af" font-size="18" font-weight="700">NOT IMPLEMENTED — no execution path to these services</text>
    <text x="48" y="639" fill="#f1f5f9" font-size="16">Backend / database · telephony / SMS · LLM / AI agent · provider connections</text>
    <text x="48" y="664" fill="#f1f5f9" font-size="16">Recording / transcription · retention / backup · workflow runner · durable saves</text>

    <text x="36" y="718" fill="#cbd5e1" font-size="14">Solid arrows: UI composition / data. Dashed arrows: untrusted demo identity and local storage.</text>
    <text x="36" y="740" fill="#94a3b8" font-size="13">Source-inspected map; protected pages were not authenticated or exercised during presentation verification.</text>
  </g>
</svg>
